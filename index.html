<style>
:root{
  --bg:#0F1720; --surface:#17212B; --surface2:#1E2A36; --line:#2A3947;
  --ink:#E6EDF3; --ink-dim:#93A4B3; --ink-faint:#64798B;
  --accent:#35B7C4; --accent-ink:#062026;
  --ok:#3DC98A; --ok-bg:#123026;
  --no:#EC6572; --no-bg:#33191E;
  --warn:#F2A65A; --warn-bg:#33261A;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F4F1; --surface:#FFFFFF; --surface2:#EFEEEA; --line:#DDDBD5;
    --ink:#1A2229; --ink-dim:#54626E; --ink-faint:#7C8A96;
    --accent:#0E7C89; --accent-ink:#FFFFFF;
    --ok:#1B7F55; --ok-bg:#E3F3EB;
    --no:#B93A45; --no-bg:#FBE9EA;
    --warn:#9A6417; --warn-bg:#FAF0E1;
  }
}
:root[data-theme="light"]{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface2:#EFEEEA; --line:#DDDBD5;
  --ink:#1A2229; --ink-dim:#54626E; --ink-faint:#7C8A96;
  --accent:#0E7C89; --accent-ink:#FFFFFF;
  --ok:#1B7F55; --ok-bg:#E3F3EB;
  --no:#B93A45; --no-bg:#FBE9EA;
  --warn:#9A6417; --warn-bg:#FAF0E1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 96px}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:12px 0 10px;border-bottom:1px solid var(--line);
}
.bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.1px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.4px}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-dim);border:1px solid var(--line)}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- home ---------- */
.hero{padding:28px 0 22px;border-bottom:1px solid var(--line)}
.hero .big{font-size:clamp(46px,17vw,68px);line-height:.92;font-weight:700;letter-spacing:-.03em}
.hero .big span{color:var(--ink-faint);font-size:.34em;font-weight:600;letter-spacing:0}
.hero p{margin:10px 0 0;color:var(--ink-dim);font-size:14.5px;max-width:46ch}

/* signature: health spine */
.spine{display:flex;gap:2px;height:26px;align-items:flex-end;margin:20px 0 4px}
.spine i{flex:1;background:var(--surface2);border-radius:2px;height:9px;transition:height .18s,background .18s}
.spine i.ok{background:var(--ok);height:26px}
.spine i.no{background:var(--no);height:18px}
.spine i.now{background:var(--accent);height:26px}
.spinekey{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10.5px;color:var(--ink-faint);letter-spacing:.4px}

.modes{display:grid;gap:10px;margin:22px 0}
.mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px}
.mode:hover{border-color:var(--accent)}
.mode:disabled{opacity:.45;cursor:default}
.mode .n{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:38px}
.mode .t{flex:1;min-width:0}
.mode .t b{display:block;font-size:15.5px;font-weight:600}
.mode .t small{display:block;color:var(--ink-dim);font-size:13px;margin-top:1px}
.mode .go{color:var(--ink-faint);font-size:20px;line-height:1}

.tlist{display:grid;gap:7px;margin:6px 0 26px}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.trow:hover{border-color:var(--accent)}
.trow .lbl{flex:1;font-size:14.5px;min-width:0}
.trow .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.trow .barwrap{width:56px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.trow .barwrap b{display:block;height:100%;background:var(--accent)}

h2.sec{font-size:12.5px;font-weight:600;color:var(--ink-dim);margin:26px 0 10px;
  letter-spacing:.3px}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.4px;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:var(--surface)}
.chip.pick{color:var(--accent);border-color:var(--accent)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.qtext{font-size:18px;line-height:1.45;font-weight:500;margin:0 0 18px;white-space:pre-wrap}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;font-size:15.5px;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not(.locked){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:5px;min-width:24px;height:24px;
  display:grid;place-items:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--surface2)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{border-color:var(--ok);color:var(--ok);background:transparent}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{border-color:var(--no);color:var(--no)}
.opt .mk{margin-left:auto;font-size:15px;flex:none;font-weight:700}
.opt.correct .mk{color:var(--ok)}
.opt.wrong .mk{color:var(--no)}

.verdict{margin:18px 0 0;border-radius:var(--radius);padding:14px 15px;
  border:1px solid var(--line);background:var(--surface)}
.verdict.good{border-color:var(--ok);background:var(--ok-bg)}
.verdict.bad{border-color:var(--no);background:var(--no-bg)}
.verdict b{display:block;font-size:15px;margin-bottom:5px}
.verdict.good b{color:var(--ok)}
.verdict.bad b{color:var(--no)}
.verdict p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.5}
.verdict p+p{margin-top:8px}
.note{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:14px;color:var(--ink-dim)}
.note b{font-size:12.5px;color:var(--ink-faint);margin-bottom:4px}
.flagnote{margin-top:11px;padding:9px 11px;border-radius:8px;background:var(--warn-bg);
  border:1px solid var(--warn);color:var(--ink);font-size:13.5px}

/* ---------- footer actions ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .inner{max-width:680px;margin:0 auto;display:flex;gap:9px;align-items:center}
.btn{flex:1;background:var(--accent);color:var(--accent-ink);border-radius:10px;
  padding:13px 16px;font-size:15.5px;font-weight:600;text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{flex:none;background:transparent;border:1px solid var(--line);color:var(--ink-dim);
  font-weight:500;padding:13px 14px}
.btn.ghost.on{color:var(--warn);border-color:var(--warn)}

/* ---------- results ---------- */
.score{text-align:center;padding:30px 0 8px}
.score .pct{font-size:clamp(56px,20vw,84px);font-weight:700;line-height:1;letter-spacing:-.03em}
.score .pct.pass{color:var(--ok)} .score .pct.fail{color:var(--no)}
.score .cap{color:var(--ink-dim);font-size:15px;margin-top:8px}
.brk{display:grid;gap:8px;margin:24px 0}
.brk div{display:flex;align-items:center;gap:11px;font-size:14px}
.brk .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .bw{width:74px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;flex:none}
.brk .bw b{display:block;height:100%;background:var(--accent)}
.brk .v{font-family:var(--mono);font-size:12px;color:var(--ink-faint);min-width:44px;text-align:right}

/* ---------- browse ---------- */
.search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:12px 14px;font-size:15.5px;margin:16px 0 4px}
.search::placeholder{color:var(--ink-faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;margin:9px 0}
.card .q{font-size:15px;font-weight:500;margin-bottom:9px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.card li{font-size:14px;color:var(--ink-dim);display:flex;gap:9px;align-items:flex-start}
.card li.c{color:var(--ok);font-weight:500}
.card li .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);flex:none;min-width:15px}
.empty{text-align:center;padding:52px 20px;color:var(--ink-dim);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:6px;font-weight:600}
.timer{font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.timer.low{color:var(--no)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

ings (Technical Service Offerings), and Application Services within the CMDB. Which CSDM domain would provide this information?","o":["Service Consumption (Sell / Consume)","Build and Integration (Build)","Design and Planning (Design)","Service Delivery (Manage Technical Services)","Foundation"],"a":[3],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":0},{"q":"A Configuration Manager responsible for a specific region wants to use the CMDB Health Dashboard to improve the data quality of the CMDB for that region. The Configuration Manager only sees the overall score and grouped by CI Class. How can the Configuration Manager get a score for regionally relevant CIs?","o":["On the CMDB health settings, activate the option, Group scores by region","Customize the CMDB Health Dashboard scheduled jobs to group the results by region","Create CMDB groups with type, health, by region"],"a":[2],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":0},{"q":"How does a CMDB Administrator use the ServiceNow Platform to ensure the data quality associated with CIs in the CMDB?","o":["CMDB Audit Business Rule","CMDB Workspace","Data Quality Business Rule","Data Quality Scheduled Job"],"a":[0,3],"src":"Data Foundation Dumps 3","topic":"CMDB Tools & Workspace","flag":1},{"q":"A company wants to track regulatory compliance. ServiceNow has an artifact type called an information object as part of the CSDM framework. What is the purpose of an information object?","o":["It describes data exchanged between an API Interface and an Application.","It describes data in general on a group of Configuration Items.","It describes the logical data to the Business Applications."],"a":[2],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":0},{"q":"The CMDB Administrator has been asked to establish Configuration Management with a functional CMDB. Which factor is most critical for successfully operationalizing the CMDB in ServiceNow?","o":["Allowing IT teams to modify CMDB records as needed to promote flexibility in data management","Establishing clear governance and continuously monitoring CMDB health","Populating the CMDB with as much data as possible to ensure a comprehensive inventory of CIs","Relying on automated discovery tools to maintain and update CMDB records"],"a":[1],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":0},{"q":"An organization is using CMDB Query Builder to find all application services with a database that has incidents and all infrastructure in those application services. Which steps does the organization take to build this query? (Choose 2)","o":["Use a CMDB Query to include application services and their related infrastructure","Add a non-CMDB table to the query","Use a Service Mapping Query to find all incidents related to the database","Use a Service Mapping Query to include non-CMDB tables like the Incident table"],"a":[0,1,2],"src":"Data Foundation Dumps 3","topic":"Data Ingestion & Discovery","flag":1},{"q":"A Business Relationship Manager in an organization wants to implement Service Portfolio Management (SPM) and to present offerings to business consumers. Which CSDM Domain does this align with?","o":["Service Delivery","Service Consumption (Sell/Consume)","Design and Planning (Design)","Build and Integration (Build)"],"a":[1],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":0},{"q":"A Configuration Management team wants to confirm that all servers in the CMDB are correctly associated with their location. Which CMDB Data Manager policy type does the team create?","o":["Archive","Retire","Certification","Attestation","Delete"],"a":[2,3],"src":"Data Foundation Dumps 3","topic":"Data Manager & Lifecycle","flag":1},{"q":"Where does a user with the appropriate role(s) review and manage the generated tasks after configuring CMDB Data Manager policies?","o":["CMDB Health Dashboard > Duplicate CIs tab","CMDB Workspace > Management tab","CMDB Health Dashboard > Audit tab","CMDB Workspace > My Work tab"],"a":[3],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":0},{"q":"Using CI Class Manager, the Tomcat identification rule has the following criterion attributes configured: • Class • Install Directory Which identifier entry configuration option must be checked to attempt a match using the Application identification rule if no match is found using the Tomcat identification rule?","o":["Applies to","Independent","Allow fallback to parent's rules","Criterion attributes"],"a":[2],"src":"Data Foundation Dumps 3","topic":"IRE, Identification & Reconciliation","flag":0},{"q":"The CMDB Administrator group seeks to filter specific CI classes that display on the CMDB Health Dashboard. This ensures that only relevant data is displayed, excluding items that are not ready for management. Which feature can the group utilize to achieve this goal?","o":["Health Inclusion Rules","Data Refresh Rules","Identification Rules","Reconciliation Rules"],"a":[0],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":0},{"q":"A retail organization needs to ensure that incidents affecting customer-facing services are resolved quickly to reduce potential revenue loss. Which CSDM attribute is used to prioritize these services?","o":["Service classification in the Technical Service","Assignment Group on the CI record","Business Criticality in the Service Offering","Affected CIs in the Incident record"],"a":[2],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":0},{"q":"An IT group has a requirement to upgrade all the Windows servers. There is a Dynamic CI Group containing all the Windows servers. What happens to the Dynamic CI Group when it is referenced from the Configuration Item field on a Change form?","o":["It displays all related CIs in the Impacted Services related list","It displays all related CIs in the Affected CIs related list","It "a":[0],"src":"Data Foundation Dumps 3","topic":"IRE, Identification & Reconciliation","flag":0},{"q":"A Configuration Management team needs to prevent duplicate server records to avoid confusion among users. Server records are identified when they are processed via the Identification and Reconciliation Engine (IRE) using the configured identification rules. Where would these rules be configured?","o":["CMDB CI Class Manager","CMDB Workspace","CMDB Health Dashboard","CMDB Data Manager"],"a":[0,1],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":1},{"q":"Which shows the most complete list of policy types that are provided by the CMDB Data Manager?","o":["Attestation, Retire, and Certification","Archive and Delete","Retire, Archive, Attestation, Certification, and Delete","Delete, Attestation, Retire, and Certification"],"a":[2],"src":"Data Foundation Dumps 3","topic":"Data Manager & Lifecycle","flag":0},{"q":"The Incident Process Owner asks which classes of CSDM are used on the Incident form. Which classes are appropriate?","o":["Business Application","Service Offering","Service Portfolio","Application Service"],"a":[1,3],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":1},{"q":"Two new CI records are imported into the hardware class of the CMDB: • C1: The name of this CI record matches the name of an existing CI record in the CMDB. • C2: The IP address of this CI record matches the IP address of an existing CI record in the CMDB. Which is correct based on the identification rule and the imported CI records? Identification Rule Table: Criteria Attribute Priority Serial Number serial_number, serial_number_type 100 Hardware serial_number 200 Hardware name 300 Network Adapter mac_address, name 400","o":["C1 will be updated with matching record and C2 will be inserted as new record.","C1 and C2 both will be inserted as new records.","C1 will be inserted as new record and C2 will be updated with matching record.","C1 and C2 both will be updated with matching records."],"a":[0,2],"src":"Data Foundation Dumps 3","topic":"IRE, Identification & Reconciliation","flag":1},{"q":"A CMDB Configuration Manager intends to implement CMDB Data Manager delete and archive policies for all server records in the New York datacenter. In which lifecycle state would servers be affected by these new policies?","o":["Inventory - Available","End of Life – Retired","Missing - Stolen","In any lifecycle state"],"a":[1],"src":"Data Foundation Dumps 3","topic":"Data Manager & Lifecycle","flag":0},{"q":"A CMDB Manager wants to start adding CSDM design and planning (design) domain components into the CMDB. Who is involved in this exercise? A.Application Owner","o":["Enterprise Architect","Business Relationship Manager","Application Service Owner"],"a":[0],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":0},{"q":"Which are CMDB Data Manager end of life policy types?","o":["Retire","Disposed","Archive","Decommission","Lost"],"a":[2,3],"src":"Data Foundation Dumps 3","topic":"Data Manager & Lifecycle","flag":1},{"q":"A CMDB Administrator wants to start utilizing the CMDB Health Dashboard and its Key Performance Indicators. What does the Administrator do to start using the dashboard?","o":["Activate the dashboard system property","Activate the dashboard scheduled jobs","Download the dashboard from the ServiceNow store","Nothing, the dashboard is activated by default"],"a":[1],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":0},{"q":"A CMDB Administrator wants to leverage the CMDB Data Foundations Dashboard. What are benefits of using this application?","o":["Provides playbooks to assist in the remediation of potential risks","Uses automation to remediate potential risks","Has a framework to create custom metrics for the CMDB","Checks that important data is valid and properly configured"],"a":[0,1,3],"src":"Data Foundation Dumps 3","topic":"CSDM Domains & Framework","flag":1},{"q":"The Change Management team in an organization wants to implement a Change across multiple CIs at the same time. Which field on the Change Request form needs to be populated with a dynamic CI group?","o":["Business Service","Configuration Item","Service Offering"],"a":[0],"src":"Data Foundation Dumps 3","topic":"Services & Relationships","flag":0},{"q":"A global enterprise integrates data from multiple discovery sources such as ServiceNow Discovery, SCCM, AWS, and manual uploads to populate its CMDB. However, each discovery source categorizes the same CIs differently, leading to duplicate records and inconsistencies across the system. As a result, the CMDB team is struggling with data accuracy and standardization. What actions does the CMDB team take to resolve the issue?","o":["Create a custom script to manually adjust incoming data before storing it in the CMDB","Implement and use identification and reconciliation rules to avoid duplicates and standardize CI classification","Use CI Class Manager to establish standardized CI classes and attributes across all discovery sources","Allow each discovery source to define its own CI class, even if it results in inconsistencies"],"a":[1,2],"src":"Data Foundation Dumps 3","topic":"CMDB Health & Data Quality","flag":1}]</script>
<script id="notes" type="application/json">{"CSDM Domains & Framework": "Five domains, and the order matters. Foundation holds shared reference data every other domain points at: locations, companies, departments, users, groups, contracts, product models. Design and Planning is the portfolio layer: Business Capability, Business Application, Information Object. Build and Integration covers pipelines and deployment artefacts. Service Delivery (Manage Technical Services) holds the operational instances: Application Services, Technology Management Services and their offerings. Service Consumption (Sell/Consume) holds Business Services, Business Service Offerings and catalog items. Ask who consumes the record and the domain usually falls out. Adoption runs Crawl, Walk, Run, Fly, on top of Foundation.", "CMDB Health & Data Quality": "Three KPIs. Completeness asks whether anything is missing, and covers Required and Recommended fields. Compliance asks whether values match the standard, and covers Audit metrics that compare actual values against a template. Correctness asks whether the data is right, and covers Duplicate, Orphan and Stale. Merging duplicates lifts Correctness; retired CIs with no end date hurt Compliance. Health Inclusion Rules decide which classes are scored at all, and the Top 10 views show which classes drag a KPI down.", "IRE, Identification & Reconciliation": "The IRE decides insert versus update. Identification rules do the matching, and they only match on attributes configured as criterion attributes, which is how an apparently unique field like IP address can still produce a duplicate. Reconciliation rules decide which data source is allowed to write which attribute. Data refresh rules add a time window so a lower-priority source can take over when the authoritative one goes quiet. Moving a CI to a more specific child class is a class upgrade; to a parent, a downgrade; sideways between siblings, a switch.", "Data Ingestion & Discovery": "Discovery is agentless and finds devices and applications across the network. Agent Client Collector is agent-based and gives real-time endpoint configuration and software usage. Service Mapping builds top-down dependency maps for application services, using patterns, connection suggestions, tags or dynamic CI groups. Service Graph Connectors bring third-party data in already mapped to out-of-the-box classes and already routed through the IRE. IntegrationHub ETL suits bulk, repeatable pipelines that need staged loads.", "Services & Relationships": "Business Application is a portfolio record and is not version-specific; Application Service is the deployed, operational instance, and you model one per region or environment rather than one Business Application per region. Business Service is consumer-facing and used for approvals; Technology Management Service is provider-facing. Infrastructure hosting reads Application > Runs on::Runs > Server. Higher up the stack, a Business Service depends on or uses an Application Service. Avoid the base Service class for new modelling.", "Data Manager & Lifecycle": "Five policy types: Retire, Archive, Attestation, Certification, Delete. A CI must be retired and at end of life before it can be archived or deleted. Attestation confirms something still exists; Certification tasks an owner with verifying attribute accuracy. Lifecycle Stage is the phase, Lifecycle Status the condition within it, and the split exists to separate physical from logical items. life_cycle_mapping is pre-populated to translate legacy status values, and custom install_status attributes are discouraged.", "Governance, Roles & Personas": "The Enterprise Architect owns the portfolio and capability view and appears across several domains. The Data Steward owns data quality and discrepancy resolution. The CMDB Manager or Administrator owns policy and KPI targets. Service Owners and Service Instance Owners own delivered services and specific running instances. Governance that works looks like a documented RACI, published policies, and a board reviewing Health scores on a schedule and assigning remediation.", "CMDB Tools & Workspace": "CI Class Manager is the one place for class hierarchy, attributes, identification and reconciliation rules, relationships and health inclusion. CMDB Workspace centralises Health, Data Manager policies and the tasks they generate. CMDB Query Builder makes drag-and-drop multi-table queries, and a saved query can populate a CMDB group or drive a dashboard. Unified Map visualises dependencies and impact paths. Natural language questions come through Intelligent Search.", "General": "Check the answer against ServiceNow product documentation where this touches a version-specific behaviour. Dump material drifts between releases, particularly around CSDM domain naming and the newer Technology Management Service terminology."}</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById('bank').textContent);
const NOTES = JSON.parse(document.getElementById('notes').textContent);
BANK.forEach((q,i)=>q.id=i);
const LETTERS='ABCDEFGH';
const KEY='cisdf.v1';

/* ---------- storage (degrades to memory if blocked) ---------- */
let store={seen:{},wrong:{},marked:{},best:{}};
try{const r=localStorage.getItem(KEY); if(r) store=Object.assign(store,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

const app=document.getElementById('app'), foot=document.getElementById('foot'),
      footinner=document.getElementById('footinner'), backBtn=document.getElementById('back'),
      titleEl=document.getElementById('title'), subEl=document.getElementById('sub');

document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':(cur==='dark'?'':'light');
  if(next) document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem(KEY+'.theme',next);}catch(e){}
};
try{const t=localStorage.getItem(KEY+'.theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}

const TOPICS=[...new Set(BANK.map(q=>q.topic))].sort();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

/* ---------- session ---------- */
let S=null;

function start(list,opts){
  opts=opts||{};
  if(!list.length){render();return;}
  S={qs:list,i:0,picks:[],log:[],mode:opts.mode||'Practice',
     ends:opts.minutes?Date.now()+opts.minutes*60000:0,done:false};
  renderQ();
}

function renderQ(){
  const q=S.qs[S.i], multi=q.a.length>1, answered=S.log[S.i]!==undefined;
  titleEl.textContent=S.mode;
  subEl.textContent=(S.i+1)+'/'+S.qs.length;
  backBtn.hidden=false; backBtn.onclick=()=>{ if(confirm('Leave this session? Progress in it is lost.')) render(); };

  const order=q.o.map((t,i)=>({t,i}));
  const marked=!!store.marked[q.id];

  app.innerHTML=`
    <div class="spine">${S.qs.map((_,i)=>{
      const l=S.log[i]; const c=l===undefined?(i===S.i?'now':''):(l?'ok':'no');
      return '<i class="'+c+'"></i>';}).join('')}</div>
    <div class="spinekey"><span>${S.log.filter(x=>x===true).length} right</span>
      <span>${S.log.filter(x=>x===false).length} wrong</span></div>
    <div class="qmeta">
      <span class="chip">${esc(q.topic)}</span>
      ${multi?'<span class="chip pick">Choose '+q.a.length+'</span>':''}
      ${q.flag?'<span class="chip warn">Source disputed</span>':''}
    </div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" id="opts">
      ${order.map(o=>`<button class="opt" data-i="${o.i}">
        <span class="k">${LETTERS[o.i]}</span><span>${esc(o.t)}</span><span class="mk"></span></button>`).join('')}
    </div>
    <div id="fb"></div>`;

  const sel=new Set();
  const optEls=[...app.querySelectorAll('.opt')];
  optEls.forEach(el=>el.onclick=()=>{
    if(S.log[S.i]!==undefined) return;
    const i=+el.dataset.i;
    if(multi){ sel.has(i)?sel.delete(i):sel.add(i); }
    else { sel.clear(); sel.add(i); }
    optEls.forEach(e=>e.classList.toggle('sel',sel.has(+e.dataset.i)));
    submit.disabled=sel.size===0;
    if(!multi) grade([...sel]);
  });

  footinner.innerHTML=`
    <button class="btn ghost ${marked?'on':''}" id="mark" aria-label="Bookmark">★</button>
    <button class="btn" id="submit" disabled>${multi?'Check answer':'Select an answer'}</button>`;
  foot.hidden=false;
  const submit=document.getElementById('submit');
  document.getElementById('mark').onclick=e=>{
    store.marked[q.id]=!store.marked[q.id];
    if(!store.marked[q.id]) delete store.marked[q.id];
    e.currentTarget.classList.toggle('on'); save();
  };
  submit.onclick=()=>{ if(S.log[S.i]===undefined) grade([...sel]); else next(); };
  if(answered) grade(S.picks[S.i],true);
  tick();
}

function grade(picked,replay){
  const q=S.qs[S.i], ok=same(picked,q.a);
  if(!replay){
    S.picks[S.i]=picked; S.log[S.i]=ok;
    store.seen[q.id]=(store.seen[q.id]||0)+1;
    if(ok) delete store.wrong[q.id]; else store.wrong[q.id]=1;
    save();
  }
  app.querySelectorAll('.opt').forEach(el=>{
    const i=+el.dataset.i; el.classList.add('locked'); el.classList.remove('sel');
    const mk=el.querySelector('.mk');
    if(q.a.includes(i)){ el.classList.add('correct'); mk.textContent='✓'; }
    else if(picked.includes(i)){ el.classList.add('wrong'); mk.textContent='✕'; }
  });
  const right=q.a.map(i=>LETTERS[i]).join(' and ');
  const chose=picked.length?picked.map(i=>LETTERS[i]).join(' and '):'nothing';
  const note=NOTES[q.topic];
  document.getElementById('fb').innerHTML=`
    <div class="verdict ${ok?'good':'bad'}">
      <b>${ok?'Correct':'Not correct'}</b>
      <p>${ok
        ? 'You chose '+chose+', which is the answer recorded in the source material.'
        : 'You chose '+chose+'. The recorded answer is '+right+' &mdash; '+esc(q.a.map(i=>q.o[i]).join('; '))+'.'}</p>
      ${note?`<div class="note"><b>Concept refresher</b><br>${esc(note)}</div>`:''}
      ${q.flag?`<div class="flagnote">This item carried more than one highlight in the source PDF, so the recorded answer is contested. Verify it against ServiceNow documentation before trusting it.</div>`:''}
    </div>`;
  const submit=document.getElementById('submit');
  submit.disabled=false;
  submit.textContent=S.i+1<S.qs.length?'Next question':'See results';
  submit.onclick=next;
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(S.i+1<S.qs.length){S.i++;renderQ();} else results(); }

function tick(){
  if(!S||!S.ends){subEl.textContent=S?(S.i+1)+'/'+S.qs.length:'';return;}
  const left=Math.max(0,S.ends-Date.now());
  const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  subEl.innerHTML=`<span class="timer ${left<300000?'low':''}">${m}:${String(s).padStart(2,'0')}</span>`;
  if(left<=0){results();return;}
  clearTimeout(tick._t); tick._t=setTimeout(tick,1000);
}

function results(){
  clearTimeout(tick._t);
  const total=S.qs.length, right=S.log.filter(x=>x===true).length;
  const pct=Math.round(right/total*100), pass=pct>=70;
  const by={};
  S.qs.forEach((q,i)=>{ const t=q.topic; by[t]=by[t]||[0,0]; by[t][1]++; if(S.log[i])by[t][0]++; });
  const missed=S.qs.filter((q,i)=>S.log[i]===false);
  titleEl.textContent='Results'; subEl.textContent='';
  app.innerHTML=`
    <div class="score">
      <div class="pct ${pass?'pass':'fail'}">${pct}%</div>
      <div class="cap">${right} of ${total} correct &middot; ${pass?'above':'below'} the 70% pass mark</div>
    </div>
    <h2 class="sec">By topic</h2>
    <div class="brk">${Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([t,[r,n]])=>
      `<div><span class="lbl">${esc(t)}</span>
        <span class="bw"><b style="width:${Math.round(r/n*100)}%"></b></span>
        <span class="v">${r}/${n}</span></div>`).join('')}</div>
    ${missed.length?`<h2 class="sec">What you missed</h2>${missed.map(q=>`
      <div class="card"><div class="q">${esc(q.q)}</div><ul>${q.o.map((t,i)=>
        `<li class="${q.a.includes(i)?'c':''}"><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></li>`
      ).join('')}</ul></div>`).join('')}`:''}`;
  footinner.innerHTML=`<button class="btn ghost" id="again">Retry missed</button>
    <button class="btn" id="home">Back to menu</button>`;
  document.getElementById('home').onclick=()=>render();
  const ag=document.getElementById('again');
  if(!missed.length){ag.disabled=true;} else ag.onclick=()=>start(shuffle(missed.slice()),{mode:'Retry missed'});
  backBtn.hidden=false; backBtn.onclick=()=>render();
}

/* ---------- home ---------- */
function render(){
  S=null; clearTimeout(tick._t);
  backBtn.hidden=true; foot.hidden=true; subEl.textContent='';
  titleEl.textContent='CIS-DF Trainer';
  const seen=Object.keys(store.seen).length, wrong=Object.keys(store.wrong).length,
        marked=Object.keys(store.marked).length;
  const spine=BANK.slice(0,60).map(q=>store.wrong[q.id]?'no':(store.seen[q.id]?'ok':''));
  app.innerHTML=`
    <div class="hero">
      <div class="big">${BANK.length}<span> questions offline</span></div>
      <p>Every question extracted from your four study files, deduplicated and tagged by topic. Nothing here needs a connection.</p>
      <div class="spine">${spine.map(c=>'<i class="'+c+'"></i>').join('')}</div>
      <div class="spinekey"><span>${seen} attempted</span><span>${wrong} to fix &middot; ${marked} bookmarked</span></div>
    </div>
    <h2 class="sec">Practice</h2>
    <div class="modes">
      <button class="mode" data-go="quick"><span class="n">20</span>
        <span class="t"><b>Quick round</b><small>Twenty mixed questions, no timer</small></span><span class="go">›</span></button>
      <button class="mode" data-go="exam"><span class="n">75</span>
        <span class="t"><b>Exam simulation</b><small>Seventy-five questions, 90 minutes, 70% to pass</small></span><span class="go">›</span></button>
      <button class="mode" data-go="wrong" ${wrong?'':'disabled'}><span class="n">${wrong}</span>
        <span class="t"><b>Fix your mistakes</b><small>${wrong?'Questions you got wrong, until you get them right':'Nothing wrong yet'}</small></span><span class="go">›</span></button>
      <button class="mode" data-go="marked" ${marked?'':'disabled'}><span class="n">${marked}</span>
        <span class="t"><b>Bookmarked</b><small>${marked?'Questions you starred for another look':'Star questions to collect them here'}</small></span><span class="go">›</span></button>
      <button class="mode" data-go="browse"><span class="n">↗</span>
        <span class="t"><b>Browse and search</b><small>Read every question with its answer</small></span><span class="go">›</span></button>
    </div>
    <h2 class="sec">Drill one topic</h2>
    <div class="tlist">${TOPICS.map(t=>{
      const qs=BANK.filter(q=>q.topic===t);
      const done=qs.filter(q=>store.seen[q.id]).length;
      return `<button class="trow" data-topic="${esc(t)}">
        <span class="lbl">${esc(t)}</span>
        <span class="barwrap"><b style="width:${Math.round(done/qs.length*100)}%"></b></span>
        <span class="cnt">${qs.length}</span></button>`;}).join('')}</div>
    <h2 class="sec">Your data</h2>
    <div class="tlist"><button class="trow" data-go="reset">
      <span class="lbl">Reset all progress</span><span class="cnt">clear</span></button></div>`;

  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.topic;
    start(shuffle(BANK.filter(q=>q.topic===t)),{mode:t});
  });
}

function go(k){
  if(k==='quick') start(shuffle(BANK.slice()).slice(0,20),{mode:'Quick round'});
  else if(k==='exam') start(shuffle(BANK.slice()).slice(0,75),{mode:'Exam simulation',minutes:90});
  else if(k==='wrong') start(shuffle(BANK.filter(q=>store.wrong[q.id])),{mode:'Fix your mistakes'});
  else if(k==='marked') start(shuffle(BANK.filter(q=>store.marked[q.id])),{mode:'Bookmarked'});
  else if(k==='browse') browse();
  else if(k==='reset'){ if(confirm('Clear every score, mistake and bookmark?')){
    store={seen:{},wrong:{},marked:{},best:{}}; save(); render(); } }
}

function browse(){
  titleEl.textContent='Browse'; backBtn.hidden=false; backBtn.onclick=()=>render();
  foot.hidden=true;
  app.innerHTML=`<input class="search" id="s" placeholder="Search questions and answers" autocomplete="off">
    <div class="spinekey" id="cnt"></div><div id="res"></div>`;
  const input=document.getElementById('s'), res=document.getElementById('res'), cnt=document.getElementById('cnt');
  function run(){
    const v=input.value.trim().toLowerCase();
    const hits=v? BANK.filter(q=>(q.q+' '+q.o.join(' ')).toLowerCase().includes(v)) : BANK.slice(0,40);
    cnt.innerHTML='<span>'+(v?hits.length+' matching':'first 40 of '+BANK.length)+'</span><span></span>';
    res.innerHTML=hits.length?hits.slice(0,120).map(q=>`
      <div class="card"><div class="q">${esc(q.q)}</div><ul>${q.o.map((t,i)=>
        `<li class="${q.a.includes(i)?'c':''}"><span class="k">${q.a.includes(i)?'✓':LETTERS[i]}</span><span>${esc(t)}</span></li>`
      ).join('')}</ul></div>`).join('')
      :'<div class="empty"><b>No match</b>Try a shorter phrase, like "orphan" or "Data Manager".</div>';
  }
  input.oninput=run; run(); input.focus();
}

render();
</script>
<script>
// Register the service worker so the app installs and works fully offline.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
